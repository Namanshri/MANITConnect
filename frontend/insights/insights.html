<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MANITConnect | Insights</title>

    <link
        rel="stylesheet"
        href="insights.css">

</head>

<body>

    <header class="navbar">

        <h1>MANITConnect</h1>

        <nav>

            <a href="../Dashboard/dashboard.html">

                Dashboard

            </a>

            <a href="insights.html" class="active">

                Insights

            </a>

            <a href="../mentor/mentors.html">

                Mentors

            </a>

            <a href="../community/community.html">

                Community

            </a>

        </nav>

        <div id="profileMenuContainer"></div>

        <button
    id="writeInsightBtn"
    class="write-btn"
    onclick="window.location.href='writeInsight.html'">

    + Write Insight

</button>
    </header>

    <section class="hero">

        <h2>

            Career Insights

        </h2>

        <p>

            Learn from real placement and internship insights shared by mentors.

        </p>

    </section>

    <section class="search-section">

        <input

            type="text"

            id="searchBox"

            placeholder="Search by title, mentor or company">

        <select id="companyFilter">

            <option value="">

                All Companies

            </option>

        </select>

        <select id="categoryFilter">

            <option value="">

                All Categories

            </option>

            <option value="Placement">

                Placement

            </option>

            <option value="Internship">

                Internship

            </option>

            <option value="Resume">

                Resume

            </option>

            <option value="Career">

                Career

            </option>

        </select>

        <select id="yearFilter">

            <option value="">

                All Years

            </option>

        </select>

    </section>

    <section
        id="tagContainer"
        class="tag-container">

    </section>

    <section
        id="insightContainer"
        class="insight-container">

    </section>

    <script src="../shared/session.js"></script>
    <script src="../shared/comingSoon.js"></script>
    <script src="../shared/profileMenu.js"></script>
    <script src="../shared/bookmarkButton.js"></script>
    <script>renderProfileMenu("profileMenuContainer");</script>
    <script src="insights.js"></script>

</body>

</html>
